<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Лучики</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--ink:#2a2146;--card:rgba(255,255,255,.86);--btn:#7c5cff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#fff;--card:rgba(32,22,66,.82)}}
:root[data-theme="dark"]{--ink:#fff;--card:rgba(32,22,66,.82)}
html,body{margin:0;height:100%;overflow:hidden;background:#c9b8ff;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.card{background:var(--card);color:var(--ink);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:28px;padding:28px 26px;text-align:center;max-width:320px;width:100%;box-shadow:0 20px 60px rgba(70,40,160,.3);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
h1{margin:0 0 6px;font-size:42px;letter-spacing:-1px}
p{margin:6px 0;font-size:15px;line-height:1.4;opacity:.8}
.big{font-size:56px;font-weight:800;margin:4px 0;line-height:1}
button{margin-top:18px;border:0;border-radius:18px;background:var(--btn);color:#fff;font-size:18px;font-weight:700;padding:15px 34px;box-shadow:0 8px 20px rgba(124,92,255,.45);cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.96)}
.row{display:flex;gap:8px;justify-content:center}.row button{padding:12px 10px;font-size:15px;margin-top:10px;flex:1}
button.ghost{background:none;box-shadow:none;color:var(--ink);opacity:.7;font-size:14px;padding:8px;margin-top:6px}
#snd{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);width:34px;height:34px;padding:0;margin:0;border-radius:50%;font-size:16px;background:rgba(255,255,255,.55);color:#000;box-shadow:none;z-index:5}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);transform:translate(-50%,-10px);background:rgba(32,22,66,.92);color:#fff;padding:10px 16px;border-radius:16px;font-size:14px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:6;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.ac{display:flex;gap:8px;align-items:center;text-align:left;padding:6px 8px;border-radius:12px;background:rgba(124,92,255,.14);margin-top:6px;font-size:13px}.ac.lock{opacity:.55}.ac span{font-size:20px}.ac small{display:block;opacity:.8;font-size:11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.sk{border-radius:16px;padding:8px;background:rgba(124,92,255,.14);border:2px solid transparent;display:flex;flex-direction:column;gap:3px;font-size:13px;cursor:pointer}
.sk.on{border-color:var(--btn)}.sk.lock{opacity:.55}.sk small{opacity:.8;font-size:11px}.pv{height:14px;border-radius:8px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin:0 3px;vertical-align:-1px}
</style></head><body>
<canvas id="c"></canvas>
<div id="ov"></div><button id="snd">🔊</button><div id="toast"></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
let W,H,dpr,S=1;
function rs(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);S=Math.min(W/390,H/760,1.3);}
addEventListener('resize',rs);rs();
let best=0;try{best=+localStorage.getItem('luchiki-best')||0}catch(e){}
let st='menu',score=0,lives=3,combo=0,maxCombo=0,orbs=[],parts=[],texts=[],spawn=0,t=0,shake=0,x=W/2,tx=W/2,trail=[];
let ac=null,mg=null,mbus=null,sbus=null,lp=null,soundOn=true,musicTimer=null,step=0,nextT=0;
try{soundOn=localStorage.getItem('luchiki-snd')!=='0'}catch(e){}
function initAudio(){if(ac)return;try{ac=new (window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=soundOn?1:0;mg.connect(ac.destination);sbus=ac.createGain();sbus.connect(mg);
lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=9000;lp.connect(mg);mbus=ac.createGain();mbus.gain.value=.7;mbus.connect(lp);
const dl=ac.createDelay(1);dl.delayTime.value=.3;const fb=ac.createGain();fb.gain.value=.3;mbus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(lp)}catch(e){ac=null}}
const CH=[[57,60,64,69],[53,57,60,65],[48,52,55,60],[55,59,62,67]],ARP=[0,2,1,3,2,1,3,2,0,1,2,3,1,2,3,2];
const mf=n=>440*Math.pow(2,(n-69)/12);
function lvl(){return st==='play'||st==='dying'?Math.floor(score/150):0}
function tone(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mbus);o.start(t);o.stop(t+d+.05)}
function hat(t,v){const n=Math.floor(ac.sampleRate*.05),b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const r=ac.createBufferSource();r.buffer=b;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=7000;const g=ac.createGain();g.gain.value=v;r.connect(f);f.connect(g);g.connect(mbus);r.start(t)}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(mbus);o.start(t);o.stop(t+.2)}
function sched(){if(!ac||!soundOn)return;const lv=Math.min(lvl(),10),sd=Math.max(.11,.2-lv*.009);
while(nextT<ac.currentTime+.25){const c=CH[(step>>4)&3],i=step&15,t=nextT;
if(i%8===0)tone(mf(c[0]-24),t,sd*7,'triangle',.2);
if(i%4===0&&(lv>=2||i%8===0))kick(t);
if(i%2===1)hat(t,lv>=1?.09:.05);
if(i%2===0||lv>=4)tone(mf(c[ARP[i]]+(i%4===3?12:0)),t,sd*3,'triangle',.08);
if(lv>=3&&i%4===2)tone(mf(c[(i>>2)%4]+24),t,sd*2,'sine',.045);
nextT+=sd;step++}}
function startMusic(){initAudio();if(!ac||!soundOn)return;try{ac.resume&&ac.resume()}catch(e){}if(!musicTimer){nextT=ac.currentTime+.1;step=0;musicTimer=setInterval(sched,80)}}
function toggleSound(){soundOn=!soundOn;try{localStorage.setItem('luchiki-snd',soundOn?'1':'0')}catch(e){}
if(mg)mg.gain.setTargetAtTime(soundOn?1:0,ac.currentTime,.05);
if(soundOn)startMusic();else if(musicTimer){clearInterval(musicTimer);musicTimer=null}sndUi()}
document.addEventListener('visibilitychange',()=>{if(!ac)return;try{document.hidden?ac.suspend():(soundOn&&ac.resume())}catch(e){}});
const BOT_LINK='https://t.me/luchiki_game_bot/play'; // замени на свою ссылку
const TG=window.Telegram&&window.Telegram.WebApp;
function today(){return new Date().toISOString().slice(0,10)}
const SK=[{id:0,n:'Классика',need:0,c:['#7c5cff','#ff7ab8','#ffc84a'],g:'255,255,255',fx:0},
{id:1,n:'Неон',need:500,c:['#00e5ff','#7a5cff','#ff2fd1'],g:'0,229,255',fx:'spark'},
{id:2,n:'Огонь',need:1500,c:['#ff3d00','#ff9100','#ffea00'],g:'255,140,0',fx:'fire'},
{id:3,n:'Лёд',need:3000,c:['#e3f6ff','#7fd3ff','#4a90ff'],g:'160,220,255',fx:'spark'},
{id:4,n:'Золото',need:6000,c:['#fff3b0','#ffc400','#b8860b'],g:'255,200,0',fx:'spark'},
{id:5,n:'Радуга',need:10000,c:null,g:'255,255,255',fx:'rain'},
{id:6,n:'Галактика',need:20000,c:['#1b0b4a','#6a2cff','#ff5fd1'],g:'180,120,255',fx:'star'}];
let total=0,skin=0,curLv=1,fxT=0;
try{total=+localStorage.getItem('luchiki-total')||0;skin=+localStorage.getItem('luchiki-skin')||0;if(!SK[skin]||total<SK[skin].need)skin=0}catch(e){}
function sv(k,v){try{localStorage.setItem('luchiki-'+k,v)}catch(e){}try{TG&&TG.CloudStorage&&TG.CloudStorage.setItem(k,String(v))}catch(e){}}
function hap(k){try{const Hf=TG&&TG.HapticFeedback;if(!Hf)return;k==='light'?Hf.impactOccurred('light'):Hf.notificationOccurred(k)}catch(e){}}
function skinCols(){const k=SK[skin];if(k.c)return k.c;const h=(t*60)%360;return[hsl(h,90,60),hsl(h+60,90,60),hsl(h+120,90,60)]}
function prevCss(k){return k.c?`linear-gradient(90deg,${k.c.join(',')})`:'linear-gradient(90deg,#f44,#fa0,#ee3,#4c4,#3cf,#74f,#e4c)'}
function emitFx(cy,cw){const f=SK[skin].fx,px=x+(Math.random()*2-1)*cw,py=cy+4*S,rn=Math.random;
if(f==='fire')parts.push({x:px,y:py,vx:(rn()-.5)*30,vy:-120-rn()*90,l:.8,c:['#ff3d00','#ff9100','#ffea00'][rn()*3|0],r:(3+rn()*3)*S});
else if(f==='rain')parts.push({x:px,y:py,vx:(rn()-.5)*40,vy:-60-rn()*50,l:.9,c:hsl((t*120+rn()*60)%360,95,60),r:(2+rn()*3)*S});
else{const c=f==='star'?['#fff','#d9b8ff','#ff9be6']:['#fff','#bff0ff','#fff3b0'];parts.push({x:px,y:py,vx:(rn()-.5)*50,vy:-40-rn()*60,l:.9,c:c[rn()*3|0],r:(1.5+rn()*2.5)*S})}}

const AL=[{id:'s100',n:'Разгон',d:'100 очков за игру'},{id:'s500',n:'Мастер',d:'500 очков за игру'},{id:'s1000',n:'Легенда',d:'1000 очков за игру'},{id:'c10',n:'Комбо ×10',d:'Поймай 10 шариков подряд'},{id:'c25',n:'Комбо ×25',d:'Поймай 25 шариков подряд'},{id:'gold5',n:'Золотая лихорадка',d:'5 золотых звёзд за игру'},{id:'pu3',n:'Коллекционер',d:'Щит, магнит и замедление за одну игру'},{id:'duel',n:'Дуэлянт',d:'Победи друга в дуэли'}];
let got={},streak=0,fz=0,runGold=0,runPU={},seenTotal=total,tq=[],tb=0;
try{got=JSON.parse(localStorage.getItem('luchiki-ach')||'{}')||{};streak=+localStorage.getItem('luchiki-streak')||0}catch(e){}
const tEl=document.getElementById('toast');
function toast(m){tq.push(m);if(!tb)nextToast()}
function nextToast(){const m=tq.shift();if(!m){tb=0;return}tb=1;tEl.textContent=m;tEl.className='show';setTimeout(()=>{tEl.className='';setTimeout(nextToast,250)},2400)}
function ach(id){if(got[id])return;const a=AL.find(k=>k.id===id);if(!a)return;got[id]=1;total+=100;sv('total',total);sv('ach',JSON.stringify(got));toast('🏆 '+a.n+' · +100');hap('success');blip(880,.2,'triangle',.07)}
function ymd(off){return new Date(Date.now()-off*864e5).toISOString().slice(0,10)}
function curStreak(){try{const l=localStorage.getItem('luchiki-day');return l===today()||l===ymd(1)?streak:0}catch(e){return 0}}
function daily(){try{const d=today(),last=localStorage.getItem('luchiki-day');if(last===d)return 0;streak=last===ymd(1)?streak+1:1;localStorage.setItem('luchiki-day',d);sv('streak',streak);return duel?0:25+25*Math.min(streak,7)}catch(e){return 0}}
function achScreen(){st='menu';const n=AL.filter(a=>got[a.id]).length;ov.innerHTML=`<div class="card"><h1 style="font-size:30px">Награды 🏆</h1><p>${n}/${AL.length} · каждая даёт +100 очков для скинов</p>${AL.map(a=>`<div class="ac${got[a.id]?'':' lock'}"><span>${got[a.id]?'🏆':'🔒'}</span><div><b>${a.n}</b><small>${a.d}</small></div></div>`).join('')}<button id="bk">Назад</button></div>`;document.getElementById('bk').onclick=menu}
const snd=document.getElementById('snd');function sndUi(){snd.textContent=soundOn?'🔊':'🔇'}
snd.onpointerdown=e=>e.stopPropagation();snd.onclick=toggleSound;sndUi();
function skinsScreen(){st='menu';ov.innerHTML=`<div class="card"><h1 style="font-size:30px">Скины 🎨</h1><p>Всего очков: <b>${total}</b></p><div class="grid">${SK.map(k=>{const ok=total>=k.need;return`<div class="sk${k.id===skin?' on':''}${ok?'':' lock'}" data-i="${k.id}"><div class="pv" style="background:${prevCss(k)}"></div><b>${k.n}</b><small>${ok?(k.id===skin?'✓ Выбран':'Открыт'):'🔒 ещё '+(k.need-total)}</small></div>`}).join('')}</div><button id="bk">Назад</button></div>`;
ov.querySelectorAll('.sk').forEach(e=>e.onclick=()=>{const k=SK[+e.dataset.i];if(total>=k.need){skin=k.id;sv('skin',skin);blip(660,.1);skinsScreen()}else blip(160,.15,'square',.05)});
document.getElementById('bk').onclick=menu}

let duel=null;
const PU=['shield','magnet','slow'],PUH={shield:205,magnet:330,slow:165},PUI={shield:'🛡',magnet:'🧲',slow:'⏳'};
let pw={shield:0,magnet:0,slow:0};
function getPU(o,cy){combo++;maxCombo=Math.max(maxCombo,combo);score+=25;runPU[o.type]=1;if(runPU.shield&&runPU.magnet&&runPU.slow)ach('pu3');burst(o.x,o.y,hsl(PUH[o.type],90,65),22);blip(660,.2);
if(o.type==='shield'){pw.shield=1;addText(o.x,cy-30,'🛡 Щит!','#4ad0ff')}
else if(o.type==='magnet'){pw.magnet=7;addText(o.x,cy-30,'🧲 Магнит!','#ff6fa8')}
else{pw.slow=6;addText(o.x,cy-30,'⏳ Замедление!','#2ec4a6')}}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function b64e(t){try{return btoa(unescape(encodeURIComponent(t))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}catch(e){return ''}}
function b64d(t){try{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';return decodeURIComponent(escape(atob(t)))}catch(e){return ''}}
function myName(){try{const u=TG.initDataUnsafe.user;return (u&&u.first_name)||'Игрок'}catch(e){return 'Игрок'}}
function readDuel(){let p='';try{p=TG.initDataUnsafe.start_param||''}catch(e){}
if(!p){try{p=new URLSearchParams(location.search).get('tgWebAppStartParam')||new URLSearchParams(location.hash.slice(1)).get('tgWebAppStartParam')||''}catch(e){}}
const m=/^d(\d{1,6})_([A-Za-z0-9_-]*)$/.exec(p);if(m)duel={score:+m[1],name:(b64d(m[2])||'Друг').slice(0,20)}}
function challenge(){const link=BOT_LINK+'?startapp=d'+score+'_'+b64e(myName().slice(0,20));const u='https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent('⚔️ Дуэль в Лучиках! Я набрал '+score+'. Сможешь победить?');try{TG&&TG.openTelegramLink?TG.openTelegramLink(u):window.open(u,'_blank')}catch(e){window.open(u,'_blank')}}

function share(){const u='https://t.me/share/url?url='+encodeURIComponent(BOT_LINK)+'&text='+encodeURIComponent('Я набрал '+score+' очков в Лучиках! Сможешь больше?');try{TG&&TG.openTelegramLink?TG.openTelegramLink(u):window.open(u,'_blank')}catch(e){window.open(u,'_blank')}}
function blip(f,d=.12,type='sine',v=.07){try{initAudio();if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(sbus);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function menu(){st='menu';ov.innerHTML=`<div class="card"><h1>Лучики ✦</h1><p>Води пальцем и лови светящиеся шарики.<br>Тёмные шарики не трогай.<br>Бонусы: 🛡 щит · 🧲 магнит · ⏳ замедление</p><p style="margin-top:12px"><span class="dot" style="background:#ff7ab8"></span><span class="dot" style="background:#ffc84a"></span><span class="dot" style="background:#4ad0ff"></span><span class="dot" style="background:#3a2a66"></span></p>${duel?`<p>⚔️ <b>${esc(duel.name)}</b> вызывает тебя!<br>Набери больше <b>${duel.score}</b></p>`:''}${best?`<p>Рекорд: <b>${best}</b></p>`:''}${curStreak()?`<p>🔥 Серия: <b>${curStreak()}</b> дн.</p>`:''}<button id="go">${duel?'Принять вызов':'Играть'}</button><div class="row"><button id="sk2">🎨 Скины</button><button id="ac2">🏆 Награды</button></div></div>`;document.getElementById('go').onclick=start;document.getElementById('sk2').onclick=skinsScreen;document.getElementById('ac2').onclick=achScreen}
function over(){st='over';const nb=score>best;if(nb){best=score;try{localStorage.setItem('luchiki-best',best)}catch(e){}try{TG&&TG.CloudStorage&&TG.CloudStorage.setItem('best',String(best))}catch(e){}}
if(duel&&score>duel.score)ach('duel');total+=score;sv('total',total);const before=seenTotal;seenTotal=total;const nw=SK.filter(k=>k.need>before&&k.need<=total),nx=SK.find(k=>k.need>total);
if(lp&&ac)lp.frequency.setTargetAtTime(600,ac.currentTime,.25);
if(nb||nw.length){hap('success');[523,659,784,1047].forEach((f,i)=>setTimeout(()=>blip(f,.2,'triangle',.08),i*110))}
const extra=(nw.length?`<p>🎨 Новый скин: <b>${nw.map(k=>k.n).join(', ')}</b>!</p>`:'')+(nx?`<p style="font-size:13px">До скина «${nx.n}»: ${nx.need-total}</p>`:'');
const dr=duel?(score>duel.score?'🏆 Ты победил: '+esc(duel.name)+'!':score===duel.score?'🤝 Ничья с '+esc(duel.name):'😤 '+esc(duel.name)+' впереди: '+duel.score):'';
ov.innerHTML=`<div class="card"><p>Игра окончена</p><div class="big">${score}</div>${dr?`<p><b>${dr}</b></p>`:''}<p>${nb?'🎉 Новый рекорд!':'Рекорд: '+best}</p><p>Лучшее комбо: ×${maxCombo}</p>${extra}<button id="go">Ещё раз</button><div class="row"><button id="du" style="background:#ff7a59">⚔️ Дуэль</button><button id="sh" style="background:#2aabee">Поделиться</button></div><button id="mn" class="ghost">🎨 Скины и меню</button></div>`;document.getElementById('go').onclick=start;document.getElementById('du').onclick=challenge;document.getElementById('sh').onclick=share;document.getElementById('mn').onclick=menu}
function start(){startMusic();if(lp&&ac)lp.frequency.setTargetAtTime(9000,ac.currentTime,.1);curLv=1;fz=0;runGold=0;runPU={};pw={shield:0,magnet:0,slow:0};score=0;lives=3;combo=0;maxCombo=0;orbs=[];parts=[];texts=[];spawn=0;t=0;st='play';ov.innerHTML='';x=tx=W/2;blip(520,.15);{const db=daily();if(db){score=db;addText(W/2,H*.4,'🔥 Серия '+streak+' дн.: +'+db,'#fff')}}}
function burst(px,py,col,n=14,sp=160){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=(.3+Math.random())*sp*S;parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,l:1,c:col,r:2+Math.random()*3*S})}}
function addText(px,py,s,col){texts.push({x:px,y:py,s,c:col,l:1})}
const hues=[335,42,195,150,270];
function mk(){const lvl=Math.min(score/400,1),bad=Math.random()<.14+.2*lvl,gold=!bad&&Math.random()<.06,r=(bad?17:15+Math.random()*7)*S;
orbs.push({x:r+Math.random()*(W-2*r),y:-r*2,r,vy:(150+170*lvl+Math.random()*60)*S,type:bad?'bad':gold?'gold':Math.random()<.05?PU[Math.random()*3|0]:'good',h:hues[Math.random()*hues.length|0],ph:Math.random()*6,sw:(Math.random()-.5)*50*S})}
function hsl(h,s,l,a=1){return`hsla(${h},${s}%,${l}%,${a})`}
function update(dt){t+=dt;pw.magnet=Math.max(0,pw.magnet-dt);pw.slow=Math.max(0,pw.slow-dt);fz=Math.max(0,fz-dt);x+=(tx-x)*Math.min(1,dt*16);trail.push({x,l:1});if(trail.length>8)trail.shift();
spawn-=dt;if(spawn<=0){mk();spawn=Math.max(.3,.85-Math.min(score/400,1)*.5)*(.7+Math.random()*.6)}
const cy=H-(110*S)-(env('bottom')),cw=(52+Math.min(combo,20)*.8)*S;
